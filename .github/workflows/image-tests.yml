name: Card image regression tests
on:
  pull_request:
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'image_sources.json'
      - 'tests/**'
      - '.github/workflows/*img*'
      - '.github/workflows/*icon*'
      - '.github/workflows/image-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
