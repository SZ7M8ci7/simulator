name: get img
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: card-image-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      # Missing sources/404 exit successfully; only real image/network errors fail.
      - name: Download and validate source images
        id: download
        continue-on-error: true
        run: python get_img.py
      - name: Generate and validate icons
        id: icons
        continue-on-error: true
        run: python make_icon.py
      # A missing card must not prevent the successfully repaired cards from syncing.
      - name: Commit verified images
        if: ${{ !cancelled() && steps.icons.outcome != 'skipped' }}
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'GitHub Actions'
          git add -u -- get/ img/
          git add -- get/ img/
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified card images'
            git pull --rebase origin main
            git push
          fi
      - name: Retain card image reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-image-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail visibly for image errors
        if: ${{ !cancelled() && (steps.download.outcome != 'success' || steps.icons.outcome != 'success') }}
        run: |
          echo '::error::Card image errors detected. See job summary and card-image-reports.'
          exit 1
