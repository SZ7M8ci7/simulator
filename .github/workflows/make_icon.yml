name: make icon
on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: card-image-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate and validate icons
        id: icons
        continue-on-error: true
        run: python make_icon.py
      - name: Commit verified icons
        if: ${{ !cancelled() && steps.icons.outcome != 'skipped' }}
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'GitHub Actions'
          git add -u -- img/
          git add -- img/
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified card icons'
            git pull --rebase origin main
            git push
          fi
      - name: Retain card image reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-image-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail visibly when cards remain unresolved
        if: ${{ !cancelled() && steps.icons.outcome != 'success' }}
        run: |
          echo '::error::Card icons remain unresolved. See job summary and card-image-reports.'
          exit 1
